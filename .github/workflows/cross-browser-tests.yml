name: Cross-Browser Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Start Student Portal
        shell: pwsh
        run: |
          $server = Start-Process python `
            -ArgumentList "-m", "http.server", "8000", "--directory", "web-app" `
            -PassThru -WindowStyle Hidden

          "SERVER_PID=$($server.Id)" >> $env:GITHUB_ENV

          Start-Sleep -Seconds 3
          Invoke-WebRequest http://localhost:8000 -UseBasicParsing

      - name: Run Selenium tests
        shell: pwsh
        env:
          SE_SKIP_DRIVER_IN_PATH: "true"
        run: mvn -B test -Dheadless=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn